services:
  postgres:
    # Must match .github/workflows/ci.yml's postgres service image
    # exactly. extraction_corrections.embedding is a pgvector `vector`
    # column (src/db/schema/extractionCorrections.ts); plain postgres:16
    # doesn't have the pgvector extension binary, so CREATE EXTENSION
    # vector (src/db/migrate.ts) fails locally with a different error
    # than a real "works in CI, not locally" scenario would need — it's
    # a straight image mismatch, not a Postgres version difference.
    image: pgvector/pgvector:pg16
    container_name: greenbar-pg
    environment:
      POSTGRES_USER: app_admin
      POSTGRES_PASSWORD: app_admin_pw
      POSTGRES_DB: greenbar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_admin -d greenbar"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    container_name: greenbar-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Provision the documents bucket exactly once on startup.
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/greenbar-documents;
      exit 0;
      "

  # Background worker. Built from Dockerfile.worker — narrower than the
  # web image: no `next build` step, no src/app or public in the image,
  # boundary enforced at typecheck via tsconfig.worker.json.
  # Restart policy lets pg-boss redeliver any in-flight jobs after a crash.
  worker:
    profiles: ["app"]              # opt-in: `docker compose --profile app up`
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_user:app_user_pw@postgres:5432/greenbar
      DATABASE_URL_WORKER: postgres://app_worker:app_worker_pw@postgres:5432/greenbar
      DATABASE_URL_ADMIN: postgres://app_admin:app_admin_pw@postgres:5432/greenbar
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_DOCUMENTS: greenbar-documents
      S3_FORCE_PATH_STYLE: "true"

volumes:
  pgdata:
  minio:
