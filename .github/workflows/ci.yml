name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app_admin
          POSTGRES_PASSWORD: app_admin_pw
          POSTGRES_DB: greenbar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_admin -d greenbar"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://app_user:app_user_pw@localhost:5432/greenbar
      DATABASE_URL_WORKER: postgres://app_worker:app_worker_pw@localhost:5432/greenbar
      DATABASE_URL_ADMIN: postgres://app_admin:app_admin_pw@localhost:5432/greenbar
      AUTH_SECRET: ci-only-not-secret
      S3_BUCKET_DOCUMENTS: greenbar-documents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      # postinstall (scripts/copy-pdf-worker.mjs) just regenerated
      # public/pdf.worker.min.mjs from the pdfjs-dist version this
      # install resolved. If that differs from what's committed, a
      # dev bumped pdfjs-dist (or react-pdf) and forgot to `git add`
      # the regenerated worker file -- the production Docker build's
      # `COPY . .` step ships the STALE committed copy, which then
      # mismatches the pdfjs-dist actually bundled in node_modules.
      # Catch it here instead of as a silent PDF-preview failure in
      # production.
      - name: Verify pdf.worker.min.mjs matches installed pdfjs-dist
        run: |
          if ! git diff --exit-code -- public/pdf.worker.min.mjs; then
            echo "::error::public/pdf.worker.min.mjs is out of sync with the installed pdfjs-dist version. Run 'npm install' locally and commit the regenerated file."
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:worker  # asserts worker compiles without src/app
      - run: npm run db:generate
      - run: npm run db:migrate
      # Regression test for the 0030 partition-backfill bug: seeds
      # synthetic audit_events rows across several months (including
      # the current month) into a throwaway DB, then runs 0030 against
      # that pre-populated state. db:migrate above only proves 0030
      # applies to an EMPTY database, which is exactly what let the
      # original bug through CI twice — DEFAULT partitions don't
      # auto-migrate rows the way that version assumed.
      - run: npm run db:verify-partition-backfill
      # Addendum §1.6 — cross-tenant RLS gate.
      - run: npm run test:rls
      - run: npm test
