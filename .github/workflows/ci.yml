name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  evidence-hash-drift:
    # Sept 2026 audit-trail hardening gate.
    #
    # The evidence packet's SHA-256 manifest hash is what makes an approved
    # invoice's audit trail cryptographically verifiable by third parties
    # (Big Four auditors, in particular) via the open-source gbverify CLI at
    # github.com/GreenbarSystems/gbverify. That verification only works as
    # long as canonicalJsonStringify in src/lib/evidence/assemble.ts and the
    # canonicalisation implemented inside both gbverify CLIs produce
    # byte-identical serialisations of the same input.
    #
    # If someone changes the canonicalisation (e.g. "cleans up" the
    # sortReplacer to use structuredClone + Object.fromEntries, or ports
    # the JSON.stringify call to a helper that adds whitespace, or ports
    # any amount from string to number), EVERY previously-sealed evidence
    # packet becomes unverifiable overnight — the customer's auditors see
    # a red X on documents that were valid when sealed. That is a category
    # of bug we cannot let ship, and it is not caught by any unit test
    # that only asserts internal invariants, because such a test would
    # move with the code being refactored.
    #
    # This job checks the contract from the OUTSIDE: it hashes a pinned
    # fixture with the real (imported) canonicalSha256 from assemble.ts,
    # then re-verifies with both gbverify implementations, then compares
    # against a snapshot value. Any drift blocks the merge.
    #
    # Ownership: whoever bumps schemaVersion in assemble.ts must also:
    #   (a) bump SUPPORTED_SCHEMA_VERSIONS in scripts/verify-gbverify-drift.ts,
    #   (b) cut a matching gbverify release + bump the vendor/gbverify submodule,
    #   (c) update EXPECTED_HASH in the drift script.
    # See CONTRIBUTING-evidence-hash.md for the full procedure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gbverify is a git submodule at vendor/gbverify pinned to a
          # tagged release. Recursive checkout is REQUIRED — without it
          # the drift script's CLI paths won't exist and CI will fail
          # for a confusing reason (missing file rather than drift).
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (drift check only needs tsx + zero-dep CLIs)
        run: npm install --no-audit --no-fund
      - name: Verify canonicalisation contract vs gbverify (Node + Python)
        run: npm run verify:gbverify-drift

  lint-and-test:
    runs-on: ubuntu-latest
    needs: evidence-hash-drift
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app_admin
          POSTGRES_PASSWORD: app_admin_pw
          POSTGRES_DB: greenbar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_admin -d greenbar"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://app_user:app_user_pw@localhost:5432/greenbar
      DATABASE_URL_WORKER: postgres://app_worker:app_worker_pw@localhost:5432/greenbar
      DATABASE_URL_ADMIN: postgres://app_admin:app_admin_pw@localhost:5432/greenbar
      AUTH_SECRET: ci-only-not-secret
      S3_BUCKET_DOCUMENTS: greenbar-documents
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      # postinstall (scripts/copy-pdf-worker.mjs) just regenerated
      # public/pdf.worker.min.mjs from the pdfjs-dist version this
      # install resolved. If that differs from what's committed, a
      # dev bumped pdfjs-dist (or react-pdf) and forgot to `git add`
      # the regenerated worker file -- the production Docker build's
      # `COPY . .` step ships the STALE committed copy, which then
      # mismatches the pdfjs-dist actually bundled in node_modules.
      # Catch it here instead of as a silent PDF-preview failure in
      # production.
      - name: Verify pdf.worker.min.mjs matches installed pdfjs-dist
        run: |
          if ! git diff --exit-code -- public/pdf.worker.min.mjs; then
            echo "::error::public/pdf.worker.min.mjs is out of sync with the installed pdfjs-dist version. Run 'npm install' locally and commit the regenerated file."
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:worker  # asserts worker compiles without src/app
      - run: npm run db:generate
      - run: npm run db:migrate
      # Regression test for the 0030 partition-backfill bug: seeds
      # synthetic audit_events rows across several months (including
      # the current month) into a throwaway DB, then runs 0030 against
      # that pre-populated state. db:migrate above only proves 0030
      # applies to an EMPTY database, which is exactly what let the
      # original bug through CI twice — DEFAULT partitions don't
      # auto-migrate rows the way that version assumed.
      - run: npm run db:verify-partition-backfill
      # Addendum §1.6 — cross-tenant RLS gate.
      - run: npm run test:rls
      - run: npm test

  docker-build-and-smoke-test:
    # F5 verification gate (2026-07-12 security audit): neither Dockerfile
    # was ever actually built in CI before this job existed, so the
    # non-root USER change (chown -R node:node /app + USER node) had no
    # automated check that the images still build and boot correctly as
    # a non-root user. This job builds both images for real and smoke-
    # tests that the web container serves a real request (proving `next
    # start` runs fine as `node`, not just that it builds) and that the
    # worker container starts and stays up (proving its non-DB startup
    # path — pg-boss connection setup — doesn't hit a permission error).
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app_admin
          POSTGRES_PASSWORD: app_admin_pw
          POSTGRES_DB: greenbar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_admin -d greenbar"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - name: Build web image
        run: docker build -t greenbar-pay-web:ci -f Dockerfile .

      - name: Build worker image
        run: docker build -t greenbar-pay-worker:ci -f Dockerfile.worker .

      - name: Confirm both images run as the non-root node user
        run: |
          web_user=$(docker run --rm --entrypoint whoami greenbar-pay-web:ci)
          echo "web image user: $web_user"
          [ "$web_user" = "node" ] || { echo "::error::web image is not running as node"; exit 1; }

          worker_user=$(docker run --rm --entrypoint whoami greenbar-pay-worker:ci)
          echo "worker image user: $worker_user"
          [ "$worker_user" = "node" ] || { echo "::error::worker image is not running as node"; exit 1; }

      - name: Smoke test — web container serves a request as node
        run: |
          docker run -d --name gbp-web --network host \
            -e NODE_ENV=production \
            -e AUTH_SECRET=ci-only-not-secret \
            -e DATABASE_URL=postgres://app_user:app_user_pw@localhost:5432/greenbar \
            -e DATABASE_URL_WORKER=postgres://app_worker:app_worker_pw@localhost:5432/greenbar \
            -e DATABASE_URL_ADMIN=postgres://app_admin:app_admin_pw@localhost:5432/greenbar \
            -e S3_BUCKET_DOCUMENTS=greenbar-documents \
            greenbar-pay-web:ci
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://localhost:3000/signin; then
              echo "web container responded after ${i}s"
              break
            fi
            if [ "$i" = 20 ]; then
              echo "::error::web container never became ready"
              docker logs gbp-web
              exit 1
            fi
            sleep 1
          done
          echo "--- response headers ---"
          curl -sD - -o /dev/null http://localhost:3000/signin | tee /tmp/web-headers.txt
          grep -qi "^Content-Security-Policy:" /tmp/web-headers.txt || { echo "::error::CSP header missing from live container response"; exit 1; }
          grep -qi "^X-Frame-Options: DENY" /tmp/web-headers.txt || { echo "::error::X-Frame-Options header missing/wrong"; exit 1; }
          docker logs gbp-web
          docker rm -f gbp-web

      - name: Smoke test — worker container starts and stays up as node
        run: |
          docker run -d --name gbp-worker --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://app_user:app_user_pw@localhost:5432/greenbar \
            -e DATABASE_URL_WORKER=postgres://app_worker:app_worker_pw@localhost:5432/greenbar \
            -e DATABASE_URL_ADMIN=postgres://app_admin:app_admin_pw@localhost:5432/greenbar \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_REGION=us-east-1 \
            -e S3_ACCESS_KEY_ID=minioadmin \
            -e S3_SECRET_ACCESS_KEY=minioadmin \
            -e S3_FORCE_PATH_STYLE=true \
            -e S3_BUCKET_DOCUMENTS=greenbar-documents \
            greenbar-pay-worker:ci
          sleep 8
          if ! docker ps --filter name=gbp-worker --filter status=running -q | grep -q .; then
            echo "::error::worker container exited early (likely a permission or startup error as non-root)"
            docker logs gbp-worker
            exit 1
          fi
          docker logs gbp-worker
          docker rm -f gbp-worker
